buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://googleapis.com' }
    }
    dependencies {
        classpath 'com.android.tools:r8:+'
    }
}

plugins {
    id 'com.android.application' version '8.10.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false
}
