name: Build Offline AI APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: gradle assembleDebug --info | grep -E "ERROR:|Error:|Manifest merger|uses-sdk" || true
      - name: Show Manifest Report if failed
        if: always()
        run: cat app/build/outputs/logs/manifest-merger-debug-report.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: MyOfflineAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
